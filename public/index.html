    ];

    function excelRowArray(row, expectedLength = 0) {
      if (Array.isArray(row)) return expectedLength ? row.slice(0, expectedLength) : row.slice();
      if (row && typeof row === 'object') {
        const numericKeys = Object.keys(row).filter(k => /^\d+$/.test(k)).sort((a,b) => Number(a)-Number(b));
        if (numericKeys.length) {
          const arr = numericKeys.map(k => row[k]);
          return expectedLength ? arr.slice(0, expectedLength) : arr;
        }
        const arr = Object.values(row);
        return expectedLength ? arr.slice(0, expectedLength) : arr;
      }
      if (row === null || row === undefined) return expectedLength ? Array(expectedLength).fill('') : [];
      return [row];
    }

    function nonBlankExcelRows(rows, expectedLength = 0) {
      let source = [];
      if (Array.isArray(rows)) source = rows;
      else if (rows && typeof rows === 'object') {
        const numericKeys = Object.keys(rows).filter(k => /^\d+$/.test(k)).sort((a,b) => Number(a)-Number(b));
        source = numericKeys.length ? numericKeys.map(k => rows[k]) : Object.values(rows);
      }
      return source
        .map(row => excelRowArray(row, expectedLength))
        .map(row => expectedLength ? [...row, ...Array(Math.max(0, expectedLength-row.length)).fill('')].slice(0, expectedLength) : row)
        .filter(row => row.some(v => String(v ?? '').trim() !== ''));
    }

    function normalizeBulkTemplatePayload(data, session) {
      const payload = { ...(data || {}) };
      const user = session?.user || {};
      const allowed = String(user.AuthorizedParishes || '').split(',').map(x => x.trim()).filter(Boolean);
      const allowedSet = new Set(allowed.map(x => x.toLowerCase()));
      const boundContractorId = String(payload?.templateMeta?.GeneratedForContractorID || (String(user.Role)==='Contractor' ? user.ContractorID : '') || '');
      const parishFallback = (session?.parishes || [])
        .filter(p => !allowedSet.size || allowedSet.has(String(p.ParishName || '').toLowerCase()))
        .map(p => [p.ParishName || '', p.Region || '']);
      const scopedContractors = (session?.contractors || []).filter(c => !boundContractorId || String(c.ContractorID) === boundContractorId);
      const contractorFallback = scopedContractors.map(c => [c.ContractorName || '', c.ContractorID || '']);
      const scopedCrews = (session?.crews || [])
        .filter(c => !boundContractorId || String(c.ContractorID) === boundContractorId)
        .filter(c => !allowedSet.size || !c.Parish || allowedSet.has(String(c.Parish || '').toLowerCase()));
      const crewFallback = scopedCrews.map(c => [c.CrewName || '', c.CrewID || '', c.ContractorID || '', c.Parish || '']);
      const scopedCrewIds = new Set(scopedCrews.map(c => String(c.CrewID)));
      const memberNamesByCrew = new Map(scopedCrews.map(c => [String(c.CrewID), []]));
      (session?.crewMembers || [])
        .filter(m => scopedCrewIds.has(String(m.CrewID)))
        .forEach(m => {
          const name = String(m.EmployeeName || '').trim();
          if (name) memberNamesByCrew.get(String(m.CrewID))?.push(name);
        });
      const crewMemberFallback = scopedCrews.map(c => [c.CrewName || '', c.CrewID || '', (memberNamesByCrew.get(String(c.CrewID)) || []).join(', ')]);
      const shiftFallback = (session?.shifts || []).map(x => [x.ShiftName || '', x.ShiftID || '', x.StartTime || '', x.EndTime || '']);
      const workTypeFallback = (session?.workTypes || []).map(x => [x.WorkTypeName || '', x.WorkTypeID || '']);

      const normalizedInstructions = nonBlankExcelRows(payload.instructions, 1);
      payload.instructions = normalizedInstructions.length ? normalizedInstructions : BULK_TEMPLATE_FALLBACK_INSTRUCTIONS.map(r => r.slice());
      payload.parishes = nonBlankExcelRows(payload.parishes, 2);
      payload.contractors = nonBlankExcelRows(payload.contractors, 2);
      payload.crews = nonBlankExcelRows(payload.crews, 4);
      payload.crewMembers = nonBlankExcelRows(payload.crewMembers, 3);
      payload.shifts = nonBlankExcelRows(payload.shifts, 4);
      payload.workTypes = nonBlankExcelRows(payload.workTypes, 2);

      if (!payload.parishes.length) payload.parishes = parishFallback;
      if (!payload.contractors.length) payload.contractors = contractorFallback;
      if (!payload.crews.length) payload.crews = crewFallback;
      if (!payload.crewMembers.length) payload.crewMembers = crewMemberFallback;
      if (!payload.shifts.length) payload.shifts = shiftFallback;
      if (!payload.workTypes.length) payload.workTypes = workTypeFallback;

      const missing = [];
      if (!payload.contractors.length) missing.push('Contractors');
      if (!payload.workTypes.length) missing.push('Work Types');
      if (!payload.parishes.length) missing.push('Parishes');
      if (!payload.crews.length) missing.push('Crews');
      if (!payload.shifts.length) missing.push('Shifts');
      if (missing.length) throw new Error(`The controlled template cannot be generated because these active configuration lists are empty: ${missing.join(', ')}. Add or activate the required records in Administration and try again.`);
      return payload;
    }

    function addReferenceSheet(workbook, name, headers, rows, widths = []) {
      const ws = workbook.addWorksheet(name, { properties: { tabColor: { argb: 'FF0E7490' } } });
      ws.addRow(headers);
      nonBlankExcelRows(rows, headers.length).forEach(row => ws.addRow(row));
      ws.getRow(1).height = 24;
      ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
      ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0E7490' } };
      ws.getRow(1).alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      headers.forEach((_, i) => { ws.getColumn(i + 1).width = widths[i] || 24; });
      ws.views = [{ state: 'frozen', ySplit: 1, showGridLines: false }];
      return ws;
    }

    async function buildProtectedBulkTemplate(rawData, session) {
      if (!window.ExcelJS) throw new Error('Excel template library is unavailable. Refresh the page and try again.');
      const data = normalizeBulkTemplatePayload(rawData, session);
      const workbook = new ExcelJS.Workbook();
      workbook.creator = 'Qwik Business Solutions';
      workbook.company = 'Qwik Business Solutions';
      workbook.subject = 'Daily Work Sheet Logging bulk import template';
      workbook.title = 'Daily Job Completion Bulk Import Template';
      workbook.created = new Date();
      workbook.modified = new Date();
      workbook.calcProperties.fullCalcOnLoad = true;

      const dataSheet = workbook.addWorksheet('DataEntry', {
        properties: { tabColor: { argb: 'FF0891B2' }, defaultRowHeight: 21 },
        views: [{ state: 'frozen', ySplit: 1, showGridLines: true }]
      });
      const widths = [26,22,15,20,28,24,30,21,18,24,30,32,16,16,16,34,28,18,18,34];
      dataSheet.columns = data.headers.map((h, i) => ({ header: h, key: h, width: widths[i] || Math.max(14, Math.min(28, h.length + 4)) }));
      dataSheet.getRow(1).height = 36;
      dataSheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 10 };
      dataSheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0E7490' } };
      dataSheet.getRow(1).alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      dataSheet.getRow(1).border = { bottom: { style: 'medium', color: { argb: 'FF155E75' } } };
      dataSheet.autoFilter = { from: 'A1', to: 'T1' };

      const requiredHeaders = new Set(['Contractor','Work Type','Date Worked','Parish','Crew','Shift','Job ID','Problem Reported','Assigned Time','On-site Time','Completed Time','Action Taken','Remarks']);
      data.headers.forEach((header, idx) => {
        const cell = dataSheet.getCell(1, idx + 1);
        cell.note = header === 'Team Members'
          ? 'Team Members — populated from the configured active members of the selected Crew. Authorized overrides are revalidated during upload.'
          : requiredHeaders.has(header)
            ? `${header} — required for application validation. Use the approved dropdown where provided.`
            : `${header} — complete where applicable.`;
      });

      const instructions = workbook.addWorksheet('Instructions', {
        properties: { tabColor: { argb: 'FF0F172A' }, defaultRowHeight: 22 },
        views: [{ showGridLines: false }]
      });
      const instructionRows = nonBlankExcelRows(data.instructions, 1);
      instructionRows.forEach((row, idx) => {
        const excelRow = instructions.addRow(row);
        excelRow.height = idx === 0 ? 34 : 34;
        excelRow.alignment = { wrapText: true, vertical: 'middle' };
        if (idx === 0) {
          excelRow.font = { bold: true, size: 16, color: { argb: 'FFFFFFFF' } };
          excelRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0F172A' } };
        } else {
          excelRow.font = { size: 10, color: { argb: 'FF334155' } };
          excelRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: idx % 2 ? 'FFF8FAFC' : 'FFFFFFFF' } };
          excelRow.border = { bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } } };
        }
      });
      instructions.getColumn(1).width = 115;
      instructions.getCell('A12').value = 'Template controls';
      instructions.getCell('A12').font = { bold: true, size: 11, color: { argb: 'FF0E7490' } };
      instructions.getCell('A13').value = `Protected with workbook/sheet password: ${BULK_TEMPLATE_PASSWORD} (for authorized maintenance only).`;
      instructions.getCell('A14').value = 'The 15-minute rule is intentionally evaluated only after upload by the application and is not enforced by this workbook.';
      instructions.getCell('A15').value = 'If a required dropdown is empty, do not type an unapproved value. Contact an administrator to correct the active configuration and download a fresh template.';
      ['A13','A14','A15'].forEach(a => {
        instructions.getCell(a).font = { size: 10, color: { argb: 'FF475569' } };
        instructions.getCell(a).alignment = { wrapText: true, vertical: 'top' };
      });

      const parishes = addReferenceSheet(workbook, 'Parishes', ['Parish','Region'], data.parishes, [28, 24]);
      const contractors = addReferenceSheet(workbook, 'Contractors', ['Contractor','ContractorID'], data.contractors, [36, 28]);
      const crews = addReferenceSheet(workbook, 'Crews', ['Crew','CrewID','ContractorID','Parish'], data.crews, [32, 26, 26, 24]);
      const crewMembers = addReferenceSheet(workbook, 'CrewMembers', ['Crew','CrewID','Team Members'], data.crewMembers, [32, 26, 90]);
      const shifts = addReferenceSheet(workbook, 'Shifts', ['Shift','ShiftID','Start','End'], data.shifts, [28, 24, 16, 16]);
      const workTypes = addReferenceSheet(workbook, 'WorkTypes', ['Work Type','WorkTypeID'], data.workTypes, [30, 26]);

      const meta = workbook.addWorksheet('_TemplateMeta');
      const templateMeta = data.templateMeta || {};
      Object.entries(templateMeta).forEach(([key, value]) => meta.addRow([key, value ?? '']));
      meta.getColumn(1).width = 34;
      meta.getColumn(2).width = 70;

      const defineList = (rangeSheet, count, name) => {
        if (!count) return;
        const last = count + 1;
        workbook.definedNames.add(`'${rangeSheet}'!$A$2:$A$${last}`, name);
      };
      defineList('Contractors', data.contractors.length, 'ContractorList');
      defineList('WorkTypes', data.workTypes.length, 'WorkTypeList');
      defineList('Parishes', data.parishes.length, 'ParishList');
      defineList('Crews', data.crews.length, 'CrewList');
      defineList('Shifts', data.shifts.length, 'ShiftList');

      const listValidation = (name, label) => ({
        type: 'list', allowBlank: false, formulae: [`=${name}`],
        showInputMessage: true, promptTitle: label, prompt: `Select an approved ${label.toLowerCase()} from the dropdown.`,
        showErrorMessage: true, errorStyle: 'stop', errorTitle: `Invalid ${label}`,
        error: `Select a valid ${label.toLowerCase()} from the dropdown list.`
      });
      const lastEntryRow = BULK_TEMPLATE_MAX_ROWS + 1;
      dataSheet.columns.forEach((column, idx) => {
        const columnNumber = idx + 1;
        column.alignment = { vertical: 'middle', wrapText: columnNumber >= 5 && ![13,14,15].includes(columnNumber) };
      });
      for (let r = 2; r <= lastEntryRow; r++) {
        const row = dataSheet.getRow(r);
        row.height = 21;
        for (let c = 1; c <= data.headers.length; c++) dataSheet.getCell(r, c).protection = { locked: false };
      }
      for (let c = 1; c <= data.headers.length; c++) dataSheet.getCell(1, c).protection = { locked: true };

      const crewRosterLastRow = Math.max(2, data.crewMembers.length + 1);
      for (let r = 2; r <= lastEntryRow; r++) {
        const teamCell = dataSheet.getCell(r, 7);
        teamCell.value = {
          formula: `IF($F${r}="","",IFERROR(VLOOKUP($F${r},'CrewMembers'!$A$2:$C$${crewRosterLastRow},3,FALSE),""))`,
          result: ''
        };
        teamCell.protection = { locked: false };
      }

      dataSheet.addConditionalFormatting({
        ref: `A2:T${lastEntryRow}`,
        rules: [{ type: 'expression', formulae: ['=MOD(ROW(),2)=0'], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFF8FAFC' }, fgColor: { argb: 'FFF8FAFC' } } } }]
      });
      dataSheet.addConditionalFormatting({
        ref: `A2:T${lastEntryRow}`,
        rules: [{ type: 'expression', formulae: ['=AND($I2<>"",COUNTA($A2:$T2)>0)'], style: { font: { color: { argb: 'FF0F172A' } } } }]
      });

      dataSheet.getColumn('C').numFmt = 'dd-mmm-yyyy';
      dataSheet.getColumn('M').numFmt = 'hh:mm';
      dataSheet.getColumn('N').numFmt = 'hh:mm';
      dataSheet.getColumn('O').numFmt = 'hh:mm';

      dataSheet.dataValidations.add(`A2:A${lastEntryRow}`, listValidation('ContractorList', 'Contractor'));
      dataSheet.dataValidations.add(`B2:B${lastEntryRow}`, listValidation('WorkTypeList', 'Work Type'));
      dataSheet.dataValidations.add(`D2:D${lastEntryRow}`, listValidation('ParishList', 'Parish'));
      dataSheet.dataValidations.add(`F2:F${lastEntryRow}`, listValidation('CrewList', 'Crew'));
      dataSheet.dataValidations.add(`H2:H${lastEntryRow}`, listValidation('ShiftList', 'Shift'));
      dataSheet.dataValidations.add(`C2:C${lastEntryRow}`, {
        type: 'date', operator: 'lessThanOrEqual', allowBlank: false, formulae: [new Date()],
        showInputMessage: true, promptTitle: 'Date Worked', prompt: 'Enter a valid work date. Future dates are not permitted.',
        showErrorMessage: true, errorStyle: 'stop', errorTitle: 'Invalid Date Worked',
        error: 'Enter a valid date that is not later than today.'
      });
      dataSheet.dataValidations.add(`M2:M${lastEntryRow}`, {
        type: 'custom', allowBlank: true,
        formulae: ['=OR(COUNTA($A2:$T2)=0,AND(ISNUMBER(M2),M2>=0,M2<1))'],
        showInputMessage: true, promptTitle: 'Assigned Time', prompt: 'Enter a valid Excel time. HH:MM in 24-hour format is recommended.',
        showErrorMessage: true, errorStyle: 'stop', errorTitle: 'Invalid Assigned Time',
        error: 'Enter a valid Excel time. Use HH:MM or an Excel time value.'
      });
      dataSheet.dataValidations.add(`N2:N${lastEntryRow}`, {
        type: 'custom', allowBlank: true,
        formulae: ['=OR(COUNTA($A2:$T2)=0,AND(ISNUMBER(N2),N2>=0,N2<1,OR(M2="",N2>=M2,AND(M2>=TIME(18,0,0),N2<=TIME(12,0,0)))))'],
        showInputMessage: true, promptTitle: 'On-site Time', prompt: 'Enter a time after Assigned Time. Overnight transition is supported.',
        showErrorMessage: true, errorStyle: 'stop', errorTitle: 'Invalid On-site Time',
        error: 'Enter a valid time that follows Assigned Time. Overnight transitions from evening/night into the next morning are allowed.'
      });
      dataSheet.dataValidations.add(`O2:O${lastEntryRow}`, {
        type: 'custom', allowBlank: true,
        formulae: ['=OR(COUNTA($A2:$T2)=0,AND(ISNUMBER(O2),O2>=0,O2<1,OR(N2="",O2>=N2,AND(N2>=TIME(18,0,0),O2<=TIME(12,0,0)))))'],
        showInputMessage: true, promptTitle: 'Completed Time', prompt: 'Enter a time after On-site Time. Overnight transition is supported.',
        showErrorMessage: true, errorStyle: 'stop', errorTitle: 'Invalid Completed Time',
        error: 'Enter a valid time that follows On-site Time. Overnight transitions from evening/night into the next morning are allowed.'
      });

      await dataSheet.protect(BULK_TEMPLATE_PASSWORD, {
        selectLockedCells: false, selectUnlockedCells: true,
        formatCells: false, formatColumns: false, formatRows: false,
        insertRows: false, insertColumns: false, deleteRows: false, deleteColumns: false,
        sort: true, autoFilter: true, objects: false, scenarios: false,
        spinCount: 1000
      });

      for (const ws of [instructions, parishes, contractors, crews, crewMembers, shifts, workTypes, meta]) {
        await ws.protect(BULK_TEMPLATE_PASSWORD, {
          selectLockedCells: true, selectUnlockedCells: false,
          formatCells: false, formatColumns: false, formatRows: false,
          insertRows: false, insertColumns: false, deleteRows: false, deleteColumns: false,
          spinCount: 1000
        });
      }

      parishes.state = 'veryHidden';
      contractors.state = 'veryHidden';
      crews.state = 'veryHidden';
      crewMembers.state = 'veryHidden';
      shifts.state = 'veryHidden';
      workTypes.state = 'veryHidden';
      meta.state = 'veryHidden';

      workbook.views = [{ activeTab: 0, firstSheet: 0, visibility: 'visible' }];
      const buffer = await workbook.xlsx.writeBuffer();
      return addWorkbookStructureProtection(buffer, BULK_TEMPLATE_PASSWORD);
    }

    function readTemplateMeta(workbook) {
      const sheet = workbook.Sheets?.['_TemplateMeta'];
      if (!sheet) return null;
      const values = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
      const meta = {};
      values.forEach(row => {
        const key = String(row?.[0] || '').trim();
        if (key) meta[key] = row?.[1] ?? '';
      });
      return meta;
    }

    function BulkUpload({ session, onImported }) {
      const [fileRows, setFileRows] = useState([]);
      const [fileName, setFileName] = useState('');
      const [fileMeta, setFileMeta] = useState(null);
      const [busy, setBusy] = useState(false);
      const [googleSource, setGoogleSource] = useState('');
      const [googleSheetName, setGoogleSheetName] = useState('');
      const isAdmin = String(session.user.Role) === 'Admin';
      const isContractor = String(session.user.Role) === 'Contractor';
      const [templateContractorId, setTemplateContractorId] = useState(isContractor ? String(session.user.ContractorID || '') : '');
      const selectedTemplateContractor = session.contractors.find(c => String(c.ContractorID) === String(templateContractorId));

      const downloadTemplate = async format => {
        if (format === 'xlsx' && isAdmin && !templateContractorId) {
          return Swal.fire({icon:'warning',title:'Select a contractor',text:'Choose the contractor this bulk template is being generated for.'});
        }
        setBusy(true);
        try {
          const requestedContractorId = isAdmin && format === 'xlsx' ? templateContractorId : (isContractor ? String(session.user.ContractorID || '') : '');
          const data = await callServer('getTemplateData', requestedContractorId);
          const contractorName = String(data?.templateMeta?.GeneratedForContractorName || '').trim();
          const suffix = contractorName ? '_' + contractorName.replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'') : '';
          if (format === 'csv') {
            downloadBlob(`Daily_Worksheet_Import_Template${suffix}.csv`, data.headers.map(h => `"${h.replaceAll('"','""')}"`).join(',') + '\n');
          } else {
            const protectedWorkbook = await buildProtectedBulkTemplate(data, session);
            downloadBlob(`Daily_Worksheet_Import_Template${suffix}.xlsx`, protectedWorkbook, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
          }
        } catch(e) { notifyError(e, 'Template could not be generated'); }
        finally { setBusy(false); }
      };

      const handleFile = async e => {
        const file = e.target.files?.[0];
        if (!file) return;
        setBusy(true);
        try {
          const buffer = await file.arrayBuffer();
          const workbook = XLSX.read(buffer, {type:'array', cellDates:false});
          const isCsv = file.name.toLowerCase().endsWith('.csv');
          const controlledMeta = isCsv ? null : readTemplateMeta(workbook);
          if (controlledMeta) {
            if (String(controlledMeta.TemplateName || '') !== BULK_TEMPLATE_NAME) throw new Error('This workbook contains template metadata that does not match the Daily Work Sheet bulk import template.');
            if (String(controlledMeta.TemplateVersion || '') !== BULK_TEMPLATE_VERSION) throw new Error(`This workbook uses unsupported template version ${controlledMeta.TemplateVersion || '(blank)'}. Download the current template and transfer the data before importing.`);
          }
          const dataSheetName = workbook.SheetNames.includes('DataEntry') ? 'DataEntry' : workbook.SheetNames[0];
          const sheet = workbook.Sheets[dataSheetName];
          const parsedRows = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
          const rows = parsedRows.filter(row => Object.entries(row).some(([key, value]) => key !== 'Team Members' && String(value ?? '').trim() !== ''));
          if (!rows.length) throw new Error('The selected file has no data rows.');
          if (rows.length > 5000) throw new Error('The file contains more than 5,000 data rows. Split it into smaller batches.');
          setFileRows(rows);
          setFileName(file.name);
          setFileMeta(controlledMeta);
        } catch(e2) { setFileRows([]); setFileName(''); setFileMeta(null); notifyError(e2, 'File could not be read'); }
        finally { setBusy(false); e.target.value=''; }
      };

      const importFile = async () => {
        if (!fileRows.length) return;
        const confirm = await Swal.fire({icon:'question',title:'Import file?',text:`${fileRows.length} rows will be validated and grouped into daily worksheets.`,showCancelButton:true,confirmButtonText:'Import'});
        if (!confirm.isConfirmed) return;
        setBusy(true);
        try {
          const result = await callServer('importBulkRows', fileRows, fileMeta || {});
          await showImportResult(result);
          if (result.imported) { setFileRows([]); setFileName(''); setFileMeta(null); onImported?.(); }
        } catch(e) { notifyError(e, 'Bulk import failed'); }
        finally { setBusy(false); }
      };

      const importGoogle = async () => {
        if (!googleSource.trim()) return Swal.fire({icon:'warning',title:'Enter a Google Sheets URL or ID'});
        setBusy(true);
        try {
          const result = await callServer('importGoogleSheet', googleSource.trim(), googleSheetName.trim());
          await showImportResult(result);
          if (result.imported) onImported?.();
        } catch(e) { notifyError(e, 'Google Sheets import failed'); }
        finally { setBusy(false); }
      };

      const previewCols = fileRows[0] ? Object.keys(fileRows[0]).slice(0,12) : [];

      return (
        <div>
          <LoadingOverlay visible={busy} text="Processing import…" />
          <PageHeader title="Bulk Upload" subtitle="Import completed job records from Excel, CSV or Google Sheets. All records use the same compliance validation engine as manual entry."
            actions={<>{!isAdmin && <Button variant="secondary" icon="fa-file-excel" onClick={()=>downloadTemplate('xlsx')}>Download XLSX Template</Button>}<Button variant="secondary" icon="fa-file-csv" onClick={()=>downloadTemplate('csv')}>Download CSV Template</Button></>} />

          {isAdmin && <Card className="p-5 mb-5">
            <div className="flex flex-col lg:flex-row lg:items-end gap-4">
              <div className="flex-1">
                <div className="flex items-center gap-3 mb-3"><div className="h-10 w-10 rounded-xl bg-violet-50 text-violet-700 grid place-items-center"><i className="fa-solid fa-user-shield"></i></div><div><h2 className="font-bold">Generate Contractor Template</h2><p className="text-xs text-slate-500">The XLSX will contain only the selected contractor, its active crews and the configured active members of those crews.</p></div></div>
                <Field label="Contractor" required><Select value={templateContractorId} onChange={e=>setTemplateContractorId(e.target.value)}><option value="">Select contractor</option>{session.contractors.map(c=><option key={c.ContractorID} value={c.ContractorID}>{c.ContractorName}</option>)}</Select></Field>
              </div>
              <div className="flex flex-wrap gap-2"><Button variant="secondary" icon="fa-file-excel" disabled={!templateContractorId} onClick={()=>downloadTemplate('xlsx')}>Download Contractor XLSX</Button></div>
            </div>
            {selectedTemplateContractor && <div className="mt-3 rounded-xl border border-violet-100 bg-violet-50/60 px-4 py-3 text-xs text-violet-900"><i className="fa-solid fa-lock mr-2"></i>The protected XLSX will be bound to <b>{selectedTemplateContractor.ContractorName}</b>. Contractor, crew and crew-member relationships are revalidated by the server during upload. CSV remains an unbound interchange format and is always validated server-side.</div>}
          </Card>}

          {isContractor && <div className="mb-5 rounded-xl border border-cyan-100 bg-cyan-50/60 px-4 py-3 text-sm text-cyan-900"><i className="fa-solid fa-lock mr-2"></i>Template downloads are automatically scoped to <b>{session.contractors[0]?.ContractorName || 'your contractor account'}</b>, including only its active crews and configured active crew members.</div>}

          <div className="grid xl:grid-cols-2 gap-5">
            <Card className="p-5">
              <div className="flex items-center gap-3 mb-4"><div className="h-10 w-10 rounded-xl bg-emerald-50 text-emerald-700 grid place-items-center"><i className="fa-solid fa-file-excel"></i></div><div><h2 className="font-bold">Excel / CSV Upload</h2><p className="text-xs text-slate-500">Accepted: .xlsx, .xls, .csv</p></div></div>
              <label className="block border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center hover:border-cyan-400 hover:bg-cyan-50/30 transition cursor-pointer">
                <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
                <i className="fa-solid fa-cloud-arrow-up text-3xl text-cyan-700"></i>
                <div className="mt-3 font-semibold">Choose an import file</div>
                <div className="mt-1 text-xs text-slate-500">Use the provided template for the most reliable import.</div>
              </label>
              {fileRows.length > 0 && <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3"><div><div className="font-semibold text-sm">{fileName}</div><div className="text-xs text-slate-500">{fileRows.length} rows ready for validation</div><div className={`text-[11px] mt-1 font-semibold ${fileMeta ? 'text-emerald-700' : 'text-amber-700'}`}><i className={`fa-solid ${fileMeta ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-1`}></i>{fileMeta ? `Controlled template v${fileMeta.TemplateVersion}${fileMeta.GeneratedForContractorName ? ` · ${fileMeta.GeneratedForContractorName}` : ''} verified` : 'Legacy / non-template file — server validation will still be applied'}</div></div><Button onClick={importFile} icon="fa-file-import">Validate & Import</Button></div>}
            </Card>

            <Card className="p-5">
              <div className="flex items-center gap-3 mb-4"><div className="h-10 w-10 rounded-xl bg-cyan-50 text-cyan-700 grid place-items-center"><i className="fa-brands fa-google-drive"></i></div><div><h2 className="font-bold">Google Sheets Import</h2><p className="text-xs text-slate-500">The executing account must have access to the source spreadsheet.</p></div></div>
              <div className="space-y-4">
                <Field label="Spreadsheet URL or ID" required>
                  <input
                    className={inputClass}
                    value={googleSource}
                    onChange={e => setGoogleSource(e.target.value)}
                    placeholder="Paste a Google Sheets URL or spreadsheet ID"
                  />
                </Field>
                <Field label="Sheet Name" help="Optional. If blank, the first sheet is used."><input className={inputClass} value={googleSheetName} onChange={e=>setGoogleSheetName(e.target.value)} placeholder="DataEntry" /></Field>
                <Button onClick={importGoogle} icon="fa-file-import">Import Google Sheet</Button>
              </div>
            </Card>
          </div>

          {fileRows.length > 0 && <Card className="mt-5 overflow-hidden"><div className="p-5 border-b border-slate-200"><h2 className="font-bold">File Preview</h2><p className="text-xs text-slate-500 mt-1">Showing the first 15 rows and first 12 columns before server-side validation.</p></div><DataTable rows={fileRows.slice(0,15)} columns={previewCols} pageSize={15} /></Card>}

          <Card className="mt-5 p-5">
            <h2 className="font-bold">Import behavior</h2>
            <div className="grid md:grid-cols-3 gap-4 mt-4 text-sm">
              <InfoTile icon="fa-layer-group" title="Automatic grouping" text="Rows with the same contractor, date, crew, shift, work type and parish form one logical worksheet. Later matching imports append jobs to that worksheet." />
              <InfoTile icon="fa-shield-halved" title="Full validation" text="Job targets, required fields, timestamps, duplicates and overruns are validated before records are saved." />
              <InfoTile icon="fa-circle-exclamation" title="Partial success" text="Valid worksheet groups are saved; invalid groups are returned with clear error messages for correction." />
            </div>
          </Card>
        </div>
      );
    }

    function InfoTile({icon,title,text}) { return <div className="rounded-xl bg-slate-50 border border-slate-200 p-4"><div className="h-9 w-9 rounded-xl bg-white border border-slate-200 grid place-items-center text-cyan-700"><i className={`fa-solid ${icon}`}></i></div><div className="font-semibold mt-3">{title}</div><div className="text-xs text-slate-500 mt-1 leading-5">{text}</div></div>; }

    async function showImportResult(result) {
      const errors = result.errors || [];
      const errorHtml = errors.slice(0,10).map(e=>`<li style="margin:4px 0">${escapeForHtml(e.message)}</li>`).join('');
      return Swal.fire({
        icon: result.failed ? (result.imported ? 'warning':'error') : 'success',
        title: 'Import complete',
        html: `<div style="text-align:left;font-size:14px">
          <p><b>Worksheet groups processed:</b> ${result.imported}</p>
          <p><b>New worksheets created:</b> ${result.created || 0}</p>
          <p><b>Existing worksheets updated:</b> ${result.merged || 0}</p>
          <p><b>Failed groups:</b> ${result.failed}</p>
          ${result.importBatchId ? `<p><b>Import batch:</b> ${escapeForHtml(result.importBatchId)}</p>` : ''}
          ${errorHtml?`<hr style="margin:12px 0"><b>Errors:</b><ul style="padding-left:18px">${errorHtml}</ul>`:''}
        </div>`,
        width: 680
      });
    }

    function escapeForHtml(s) { return String(s||'').replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }

    /* =========================
     * REPORTS
     * ========================= */

    const REPORT_COLUMNS = {
      worksheet:['DateWorked','ContractorName','Parish','CrewName','ShiftName','WorkType','JobsCompleted','RequiredJobs','JobVariance','ProductionCompliancePercent','DataCompletenessPercent','TimingCompliancePercent','SLACompliancePercent','OverallCompliancePercent','ComplianceStatus','ExceptionCount','SourceType','SubmittedBy'],
      jobs:['DateWorked','ContractorName','Parish','CrewName','JobID','CustomerName','ProblemReported','AssignedTime','OnSiteTime','CompletedTime','AssignToOnSiteMinutes','OnSiteToCompleteMinutes','AssignToCompleteMinutes','DataComplete','TimingException','SLAException','DuplicateSuspected','ImportBatchID','ImportSource'],
      contractor:['Name','Worksheets','JobsCompleted','RequiredJobs','JobBalance','CompliancePercent','AverageOverallCompliance','BelowTarget'],
      crew:['Name','Worksheets','JobsCompleted','RequiredJobs','JobBalance','CompliancePercent','AverageOverallCompliance','BelowTarget'],
      parish:['Name','Worksheets','JobsCompleted','RequiredJobs','JobBalance','CompliancePercent','AverageOverallCompliance','BelowTarget'],
      timing:['DateWorked','ContractorName','Parish','CrewName','JobID','AssignedTime','OnSiteTime','CompletedTime','AssignToOnSiteMinutes','OnSiteToCompleteMinutes','AssignToCompleteMinutes','TimingException','SLAException'],
      exceptions:['DateWorked','ContractorName','Parish','CrewName','ExceptionType','Severity','Description','DetectedValue','ExpectedValue','Status','ReviewedBy','ReviewedAt','ResolutionNotes','ExceptionID']
    };

    function Reports({ session, fixedType = null, title = 'Reports', subtitle = 'Filter, review and export operational worksheet data.', fixedSubmittedBy = null, onEdit }) {
      const [filters, setFilters] = useState({ month: currentMonthString(), ContractorID: session.user.Role==='Contractor'?session.user.ContractorID:'', ...(fixedSubmittedBy?{submittedBy:fixedSubmittedBy}:{}) });
      const [type, setType] = useState(fixedType || 'worksheet');
      const [rows, setRows] = useState([]);
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const result = await callServer('getReportData', {...filters, ...(fixedSubmittedBy?{submittedBy:fixedSubmittedBy}:{})}, fixedType || type);
          setRows(result.rows || []);
        } catch(e) { notifyError(e, 'Report could not be loaded'); }
        finally { setLoading(false); }
      }, [JSON.stringify(filters), type, fixedType, fixedSubmittedBy]);

      useEffect(()=>{load();},[load]);
      const actualType = fixedType || type;
      const columns = REPORT_COLUMNS[actualType] || (rows[0]?Object.keys(rows[0]):[]);

      const renderCell = (row,c) => {
        if (c.toLowerCase().includes('percent')) return <span className="font-semibold">{pct(row[c])}</span>;
        if (['ComplianceStatus','ProductionStatus','Status','Severity'].includes(c)) return <Badge status={row[c]}>{safeCell(row[c])}</Badge>;
        if (['DataComplete','TimingException','SLAException','DuplicateSuspected'].includes(c)) return row[c] === '' ? '' : <span className={bool(row[c]) ? 'text-red-700 font-semibold' : 'text-emerald-700'}>{bool(row[c])?'Yes':'No'}</span>;
        return <span className="break-words">{safeCell(row[c])}</span>;
      };

      return (
        <div>
          <PageHeader title={title} subtitle={subtitle} actions={<><Button variant="secondary" onClick={load} icon="fa-rotate">Refresh</Button><Button variant="secondary" onClick={()=>exportRowsToCsv(rows,`${actualType}_report_${todayString()}.csv`)} icon="fa-download">Export CSV</Button></>} />
          <Filters session={session} filters={filters} setFilters={setFilters} />
          {!fixedType && <Card className="p-4 mb-5"><div className="flex flex-wrap gap-2">{[['worksheet','Worksheet Summary'],['jobs','Job Detail'],['contractor','Contractor Performance'],['crew','Crew Performance'],['parish','Parish Performance'],['timing','Timing Analysis'],['exceptions','Exceptions']].map(([k,l])=><button key={k} onClick={()=>setType(k)} className={`rounded-xl border px-3 py-2 text-xs font-semibold ${type===k?'bg-cyan-700 text-white border-cyan-700':'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'}`}>{l}</button>)}</div></Card>}
          <Card className="overflow-hidden">
            {loading ? <div className="p-8"><div className="h-80 rounded-xl skeleton"></div></div> : <DataTable rows={rows} columns={columns} rowKey={actualType==='worksheet'?'WorksheetID':actualType==='exceptions'?'ExceptionID':null} renderCell={renderCell}
              actions={fixedSubmittedBy && actualType==='worksheet' ? row => <Button variant="secondary" className="!px-3 !py-1.5" onClick={()=>onEdit?.(row.WorksheetID)} icon="fa-pen">Edit</Button> : null} />}
          </Card>
        </div>
      );
    }

    function ExceptionReport({ session }) {
      const [filters,setFilters]=useState({month:currentMonthString(),ContractorID:session.user.Role==='Contractor'?session.user.ContractorID:''});
      const [rows,setRows]=useState([]); const [loading,setLoading]=useState(true); const canReview=['Admin','Superuser'].includes(session.user.Role);
      const load=useCallback(async()=>{setLoading(true);try{setRows((await callServer('getReportData',filters,'exceptions')).rows||[])}catch(e){notifyError(e)}finally{setLoading(false)}},[JSON.stringify(filters)]);
      useEffect(()=>{load()},[load]);
      const review=async row=>{
        const result=await Swal.fire({title:'Review exception',html:`<div style="text-align:left;font-size:13px;margin-bottom:10px"><b>${escapeForHtml(row.ExceptionType)}</b><br>${escapeForHtml(row.Description)}</div>`,input:'textarea',inputLabel:'Resolution / review notes',inputValue:row.ResolutionNotes||'',showCancelButton:true,confirmButtonText:'Mark reviewed'});
        if(!result.isConfirmed)return;
        try{await callServer('updateExceptionReview',row.ExceptionID,'Reviewed',result.value||'');notifySuccess('Exception reviewed');load();}catch(e){notifyError(e,'Review could not be saved')}
      };
      return <div><PageHeader title="Exceptions" subtitle="Compliance, timestamp, overrun, duplicate and data-quality exceptions." actions={<><Button variant="secondary" onClick={load} icon="fa-rotate">Refresh</Button><Button variant="secondary" onClick={()=>exportRowsToCsv(rows,`exceptions_${todayString()}.csv`)} icon="fa-download">Export CSV</Button></>} /><Filters session={session} filters={filters} setFilters={setFilters}/><Card className="overflow-hidden">{loading?<div className="p-8"><div className="h-80 skeleton rounded-xl"></div></div>:<DataTable rows={rows} columns={REPORT_COLUMNS.exceptions} rowKey="ExceptionID" renderCell={(r,c)=>['Status','Severity'].includes(c)?<Badge status={r[c]}>{safeCell(r[c])}</Badge>:safeCell(r[c])} actions={canReview?row=><Button variant="secondary" className="!px-3 !py-1.5" onClick={()=>review(row)} icon="fa-check">Review</Button>:null}/>}</Card></div>;
    }

    /* =========================
     * AI INSIGHTS PAGE
     * ========================= */

    function InsightsPage({ session }) {
      const [filters,setFilters]=useState({month:currentMonthString(),ContractorID:session.user.Role==='Contractor'?session.user.ContractorID:''});
      const [data,setData]=useState(null); const [loading,setLoading]=useState(true);
      const load=useCallback(async()=>{setLoading(true);try{setData(await callServer('getAiInsights',filters))}catch(e){notifyError(e)}finally{setLoading(false)}},[JSON.stringify(filters)]);
      useEffect(()=>{load()},[load]);
      return <div><PageHeader title="AI Insights" subtitle="Rules-based automated compliance narrative generated from the current filtered metrics." actions={<Button variant="secondary" onClick={load} icon="fa-wand-magic-sparkles">Regenerate</Button>}/><Filters session={session} filters={filters} setFilters={setFilters}/>{loading?<Card className="p-6"><div className="h-64 skeleton rounded-xl"></div></Card>:<div className="grid xl:grid-cols-3 gap-5"><Card className="xl:col-span-2 p-6"><div className="flex items-center gap-3 mb-5"><div className="h-12 w-12 rounded-2xl bg-violet-50 text-violet-700 grid place-items-center"><i className="fa-solid fa-wand-magic-sparkles"></i></div><div><h2 className="font-bold text-lg">Automated Compliance Summary</h2><p className="text-xs text-slate-500">Generated from current application data</p></div></div><div className="rounded-2xl border border-slate-200 bg-slate-50 p-6 text-slate-700 leading-8 min-h-[260px]">{data?.insights}</div><div className="mt-4 text-xs text-slate-400"><i className="fa-solid fa-circle-info mr-1"></i>No external AI model is used. The text is generated deterministically from compliance trends.</div></Card><Card className="p-5"><h3 className="font-bold">Metrics used</h3><div className="mt-4 space-y-4">{data?.metrics&&Object.entries(data.metrics).slice(0,12).map(([k,v])=><MetricRow key={k} label={k.replace(/([a-z])([A-Z])/g,'$1 $2')} value={typeof v==='number'?v.toFixed(2).replace(/\.00$/,''):safeCell(v)}/>)}</div></Card></div>}</div>;
    }

    /* =========================
     * ADMINISTRATION
     * ========================= */

    const ADMIN_ENTITIES = ['Users','Contractors','Crews','CrewMembers','Parishes','Shifts','WorkTypes','Settings','LegalContent'];

    function AdminPage({ session, refreshSession }) {
      const [entity,setEntity]=useState('Users'); const [data,setData]=useState(null); const [form,setForm]=useState(null); const [busy,setBusy]=useState(false);
      const load=useCallback(async()=>{setBusy(true);try{setData(await callServer('getAdminData',entity));setForm(null)}catch(e){notifyError(e,'Administration data could not be loaded')}finally{setBusy(false)}},[entity]);
      useEffect(()=>{load()},[load]);

      const editableHeaders=useMemo(()=>data?data.headers.filter(h=>!['CreatedAt','UpdatedAt'].includes(h)):[],[data]);
      const newRecord=()=>{const r={};editableHeaders.forEach(h=>r[h]=h==='Active'?true:'');setForm(r)};
      const edit=row=>setForm({...row});
      const save=async()=>{setBusy(true);try{await callServer('saveAdminRecord',entity,form);notifySuccess('Record saved');await load();await refreshSession();}catch(e){notifyError(e,'Record could not be saved')}finally{setBusy(false)}};
      const remove=async row=>{const yes=await Swal.fire({icon:'warning',title:'Delete record?',text:'This action removes the selected configuration row.',showCancelButton:true,confirmButtonColor:'#dc2626',confirmButtonText:'Delete'});if(!yes.isConfirmed)return;setBusy(true);try{await callServer('deleteAdminRecord',entity,row[data.keyField]);notifySuccess('Record deleted');await load();await refreshSession();}catch(e){notifyError(e,'Record could not be deleted')}finally{setBusy(false)}};
      const showDb=async()=>{try{const d=await callServer('getApplicationDatabaseInfo');Swal.fire({title:'Application Database',html:`<div style="text-align:left;font-size:14px"><b>Name:</b> ${escapeForHtml(d.name)}<br><b>Engine:</b> ${escapeForHtml(d.engine)}<br><b>Database path:</b><br><code style="word-break:break-all">${escapeForHtml(d.databasePath)}</code><br><br><small>Application version: ${escapeForHtml(d.appVersion)}</small></div>`,width:650})}catch(e){notifyError(e)}};

      const renderAdminField=(header)=>{
        const value=form?.[header]??''; const common={value,onChange:e=>setForm({...form,[header]:e.target.value})};
        if(header===data?.keyField && value) return <input className={`${inputClass} bg-slate-100`} value={value} readOnly/>;
        if(header==='Active') return <Select value={String(bool(value))} onChange={e=>setForm({...form,Active:e.target.value==='true'})}><option value="true">Active</option><option value="false">Inactive</option></Select>;
        if(header==='Role') return <Select {...common}><option value="">Select role</option><option>Admin</option><option>Superuser</option><option>Contractor</option></Select>;
        if(header==='ContractorID') return <Select {...common}><option value="">None / Select</option>{session.contractors.map(c=><option key={c.ContractorID} value={c.ContractorID}>{c.ContractorName} ({c.ContractorID})</option>)}</Select>;
        if(header==='CrewID') return <Select {...common}><option value="">Select crew</option>{session.crews.map(c=><option key={c.CrewID} value={c.CrewID}>{c.CrewName}</option>)}</Select>;
        if(header==='Parish') return <Select {...common}><option value="">Select parish</option>{session.parishes.map(p=><option key={p.ParishID} value={p.ParishName}>{p.ParishName}</option>)}</Select>;
        if(header==='AuthorizedParishes') return <MultiSelectDropdown
          value={value}
          options={session.parishes.map(p=>({value:p.ParishName,label:p.ParishName}))}
          onChange={nextValue=>setForm({...form,AuthorizedParishes:nextValue})}
          placeholder="All parishes (no restriction)"
        />;
        if(header==='Content'||header==='Description'||header==='Address') return <textarea className={`${inputClass} min-h-24`} {...common}/>;
        return <input className={inputClass} {...common}/>;
      };

      const tableCols=data?data.headers.filter(h=>!['CreatedAt','UpdatedAt'].includes(h)).slice(0,8):[];
      return <div><LoadingOverlay visible={busy} text="Updating administration data…"/><PageHeader title="Administration" subtitle="Manage users, contractors, crews and dynamic application configuration stored in the Node.js application database." actions={<><Button variant="secondary" onClick={showDb} icon="fa-database">Database Info</Button><Button onClick={newRecord} icon="fa-plus">New {entity.replace(/s$/,'')}</Button></>}/><Card className="p-4 mb-5"><div className="flex flex-wrap gap-2">{ADMIN_ENTITIES.map(x=><button key={x} onClick={()=>setEntity(x)} className={`rounded-xl border px-3 py-2 text-xs font-semibold ${entity===x?'bg-slate-900 text-white border-slate-900':'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'}`}>{x}</button>)}</div></Card><div className="grid xl:grid-cols-[1fr_430px] gap-5 items-start"><Card className="overflow-hidden">{!data?<div className="p-8"><div className="h-80 skeleton rounded-xl"></div></div>:<DataTable rows={data.rows} columns={tableCols} rowKey={data.keyField} renderCell={(r,c)=>c==='Active'?<Badge status={bool(r[c])?'Target Met':'Critical'}>{bool(r[c])?'Active':'Inactive'}</Badge>:safeCell(r[c])} actions={row=><div className="inline-flex gap-1"><button onClick={()=>edit(row)} className="h-8 w-8 rounded-lg border border-slate-200 hover:bg-slate-50" title="Edit"><i className="fa-solid fa-pen"></i></button>{entity!=='Settings'&&<button onClick={()=>remove(row)} className="h-8 w-8 rounded-lg border border-red-200 text-red-600 hover:bg-red-50" title="Delete"><i className="fa-solid fa-trash"></i></button>}</div>}/>}</Card><Card className="p-5 xl:sticky xl:top-24">{form?<><div className="flex items-center justify-between mb-4"><div><h2 className="font-bold">{form[data?.keyField]?'Edit':'New'} {entity.replace(/s$/,'')}</h2><p className="text-xs text-slate-500">Changes are written directly to the application database.</p></div><button className="h-8 w-8 rounded-lg hover:bg-slate-100" onClick={()=>setForm(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="space-y-4 max-h-[65vh] overflow-y-auto app-scrollbar pr-1">{editableHeaders.map(h=><Field key={h} label={h.replace(/([a-z])([A-Z])/g,'$1 $2')}>{renderAdminField(h)}</Field>)}</div><div className="mt-5 flex justify-end gap-2"><Button variant="secondary" onClick={()=>setForm(null)}>Cancel</Button><Button onClick={save} icon="fa-floppy-disk">Save</Button></div></>:<EmptyState icon="fa-pen-to-square" title="Select or create a record" text="Choose a row to edit or click New to add configuration."/>}</Card></div></div>;
    }

    /* =========================
     * LEGAL / INFORMATION
     * ========================= */

    function LegalContentRenderer({ content }) {
      const lines=String(content||'').split(/\r?\n/);
      const nodes=[];
      let bullets=[];
      const flushBullets=()=>{
        if(!bullets.length)return;
        const items=bullets;
        bullets=[];
        nodes.push(<ul key={`ul-${nodes.length}`} className="my-4 space-y-2 pl-1">{items.map((item,i)=><li key={i} className="flex gap-3 text-slate-700 leading-7"><i className="fa-solid fa-circle-check text-cyan-600 text-[11px] mt-2.5 shrink-0"></i><span>{item}</span></li>)}</ul>);
      };
      lines.forEach((raw,i)=>{
        const line=raw.trim();
        if(!line){flushBullets();return;}
        if(line.startsWith('## ')){
          flushBullets();
          nodes.push(<h2 key={`h-${i}`} className="mt-8 first:mt-0 text-lg md:text-xl font-bold text-slate-900 tracking-tight">{line.slice(3)}</h2>);
          return;
        }
        if(line.startsWith('- ')){
          bullets.push(line.slice(2));
          return;
        }
        flushBullets();
        nodes.push(<p key={`p-${i}`} className="mt-3 text-slate-700 leading-8">{line}</p>);
      });
      flushBullets();
      return <div>{nodes}</div>;
    }

    function LegalPage({ session, pageKey, refreshSession }) {
      const page=session.legal.find(x=>String(x.PageKey).toLowerCase()===String(pageKey).toLowerCase())||{Title:pageKey,Content:'No content has been configured for this page.'};
      const [repairing,setRepairing]=useState(false);
      const icons={about:'fa-circle-info',licensing:'fa-file-contract',disclaimer:'fa-scale-balanced',copyright:'fa-copyright'};
      const accents={
        about:{icon:'bg-cyan-50 text-cyan-700',notice:'border-cyan-200 bg-cyan-50 text-cyan-900',noticeIcon:'fa-circle-info',noticeText:'This page describes the purpose, scope, architecture and operational intent of the application.'},
        licensing:{icon:'bg-emerald-50 text-emerald-700',notice:'border-emerald-200 bg-emerald-50 text-emerald-900',noticeIcon:'fa-circle-check',noticeText:'No licensing enforcement is implemented. There are no activation keys, subscription checks, expiry controls, paywalls or licence-tier feature restrictions in this codebase.'},
        disclaimer:{icon:'bg-amber-50 text-amber-700',notice:'border-amber-200 bg-amber-50 text-amber-900',noticeIcon:'fa-triangle-exclamation',noticeText:'Use the application as decision support. Material exceptions and discrepancies should be verified against authorized source records and applicable procedures before action is taken.'},
        copyright:{icon:'bg-violet-50 text-violet-700',notice:'border-violet-200 bg-violet-50 text-violet-900',noticeIcon:'fa-copyright',noticeText:'Qwik Business Solutions attribution applies to the original application material; third-party components and user/operational data retain their respective ownership and rights.'}
      };
      const accent=accents[pageKey]||accents.about;
      const owner=session.settings.COPYRIGHT_OWNER||'Qwik Business Solutions';
      const serverVersion=String(session.appVersion||APP_VERSION||'unknown');
      const legacyTitles=['About','Licensing','Disclaimer','Copyright'];
      const contentText=String(page.Content||'').trim();
      const legacyContent=legacyTitles.includes(String(page.Title||'')) && contentText.length < 900;
      const versionMismatch=serverVersion!==CLIENT_BUILD_VERSION;

      const repairLegalContent=async()=>{
        const confirm=await Swal.fire({
          icon:'question',
          title:'Restore detailed information pages?',
          text:'This replaces the four bundled About, Licensing, Disclaimer and Copyright records in LegalContent with the current detailed defaults. Other application data is not changed.',
          showCancelButton:true,
          confirmButtonText:'Restore detailed pages'
        });
        if(!confirm.isConfirmed)return;
        setRepairing(true);
        try{
          await callServer('upgradeLegalContent');
          await refreshSession?.();
          await Swal.fire({icon:'success',title:'Information pages updated',text:'The detailed legal and information content has been restored.'});
        }catch(e){
          notifyError(e,'Legal content could not be upgraded');
        }finally{setRepairing(false)}
      };

      return <div className="max-w-5xl mx-auto">
        <LoadingOverlay visible={repairing} text="Updating information pages…"/>
        <PageHeader title={page.Title} subtitle={`${session.settings.APP_NAME || 'Daily Work Sheet Logging'} · ${owner}`}/>

        {(versionMismatch||legacyContent) && <div className="mb-5 rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm text-amber-950">
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div>
              <div className="font-bold"><i className="fa-solid fa-triangle-exclamation mr-2"></i>{versionMismatch?'Application files are out of sync':'Legacy information content detected'}</div>
              <div className="mt-1 leading-6 text-amber-900">
                {versionMismatch
                  ? `This web client is v${CLIENT_BUILD_VERSION}, but the Node.js backend reports v${serverVersion}. Deploy the matching frontend and backend release together.`
                  : 'This page is still using the short content seeded by the original release rather than the current detailed information-page content.'}
              </div>
            </div>
            {session.user.Role==='Admin'&&!versionMismatch&&<Button variant="secondary" onClick={repairLegalContent} icon="fa-screwdriver-wrench">Restore detailed content</Button>}
          </div>
        </div>}

        <div className="grid md:grid-cols-3 gap-4 mb-5">
          <Card className="p-4"><div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Application Version</div><div className="mt-1 font-bold text-slate-800">v{CLIENT_BUILD_VERSION}</div>{serverVersion!==CLIENT_BUILD_VERSION&&<div className="mt-1 text-[11px] font-semibold text-amber-700">Backend v{serverVersion}</div>}</Card>
          <Card className="p-4"><div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Platform</div><div className="mt-1 font-bold text-slate-800">Node.js + SQLite</div></Card>
          <Card className="p-4"><div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Attribution</div><div className="mt-1 font-bold text-slate-800">{owner}</div></Card>
        </div>
        <Card className="overflow-hidden">
          <div className="p-6 md:p-9 border-b border-slate-100 bg-gradient-to-br from-white to-slate-50">
            <div className={`h-14 w-14 rounded-2xl grid place-items-center text-xl ${accent.icon}`}><i className={`fa-solid ${icons[pageKey]||'fa-file-lines'}`}></i></div>
            <div className={`mt-6 rounded-2xl border p-4 text-sm leading-6 ${accent.notice}`}><i className={`fa-solid ${accent.noticeIcon} mr-2`}></i>{accent.noticeText}</div>
          </div>
          <div className="p-6 md:p-9"><LegalContentRenderer content={page.Content}/><div className="mt-10 pt-5 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400"><span>Last updated: {page.UpdatedAt || 'Not specified'}</span><span>Configured from LegalContent · {owner}</span></div></div>
        </Card>
      </div>;
    }

    /* =========================
     * ROOT APPLICATION
     * ========================= */

    function AccessError({ message }) {
      return <div className="min-h-screen bg-slate-950 text-white grid place-items-center p-5"><div className="max-w-xl w-full rounded-3xl border border-white/10 bg-white/5 p-7 text-center"><div className="h-14 w-14 rounded-2xl bg-red-500/10 text-red-300 grid place-items-center mx-auto text-xl"><i className="fa-solid fa-lock"></i></div><h1 className="text-2xl font-bold mt-5">Access unavailable</h1><p className="text-slate-300 mt-3 leading-6">{message}</p><div className="mt-5 rounded-xl bg-black/20 border border-white/10 p-4 text-left text-xs text-slate-400 leading-5">Verify that your authenticated email exists as an active record in <b>Administration → Users</b>. For a first deployment, set <b>BOOTSTRAP_ADMIN_EMAIL</b> before starting the Node.js service.</div><div className="mt-5 text-xs text-slate-500">Qwik Business Solutions</div></div></div>;
    }

    function InitialLoader() {
      return <div className="min-h-screen bg-slate-950 grid place-items-center text-white"><div className="text-center"><div className="h-16 w-16 rounded-2xl bg-cyan-400/10 border border-cyan-400/20 text-cyan-300 grid place-items-center mx-auto text-xl"><i className="fa-solid fa-bolt"></i></div><div className="mt-5 flex justify-center"><Spinner size="lg"/></div><div className="mt-4 font-semibold">Loading Daily Work Sheet Logging…</div><div className="mt-1 text-xs text-slate-500">Initializing configuration and user access</div></div></div>;
    }

    class ErrorBoundary extends React.Component {
      constructor(props){super(props);this.state={error:null};}
      static getDerivedStateFromError(error){return{error};}
      componentDidCatch(error,info){console.error(error,info)}
      render(){return this.state.error?<AccessError message={`The interface encountered an unexpected error: ${this.state.error.message}`}/>:this.props.children}
    }

    function App() {
      const [session,setSession]=useState(null); const [initialError,setInitialError]=useState(''); const [view,setView]=useState('landing'); const [editWorksheetId,setEditWorksheetId]=useState('');
      const loadSession=useCallback(async()=>{try{setSession(await callServer('getSessionData'));setInitialError('')}catch(e){setInitialError(e.message)}},[]);
      useEffect(()=>{loadSession()},[loadSession]);
      if(initialError)return <AccessError message={initialError}/>;
      if(!session)return <InitialLoader/>;

      const navigate=v=>setView(v);
      const editWorksheet=id=>{setEditWorksheetId(id);setView('submit')};
      const content=()=>{
        switch(view){
          case'dashboard':return <Dashboard session={session}/>;
          case'submit':return <WorksheetForm session={session} editWorksheetId={editWorksheetId} onEditConsumed={()=>setEditWorksheetId('')} onSaved={()=>{}}/>;
          case'bulk':return <BulkUpload session={session}/>;
          case'mysubmissions':return <Reports session={session} title="My Submissions" subtitle="Review and edit worksheets you submitted." fixedType="worksheet" fixedSubmittedBy={session.user.Email} onEdit={editWorksheet}/>;
          case'teamcompliance':return <Reports session={session} title="Team Compliance" subtitle="Crew-level production compliance, overall compliance and below-target worksheet shifts." fixedType="crew"/>;
          case'exceptions':return <ExceptionReport session={session}/>;
          case'timing':return <Reports session={session} title="Timing Analysis" subtitle="Analyze assignment-to-on-site, on-site-to-completion and assignment-to-completion performance." fixedType="timing"/>;
          case'reports':return <Reports session={session}/>;
          case'insights':return <InsightsPage session={session}/>;
          case'admin':return session.user.Role==='Admin'?<AdminPage session={session} refreshSession={loadSession}/>:<AccessError message="Administrator access is required."/>;
          case'about':case'licensing':case'disclaimer':case'copyright':return <LegalPage session={session} pageKey={view} refreshSession={loadSession}/>;
          default:return <Dashboard session={session}/>;
        }
      };
      if(view==='landing')return <Landing session={session} onNavigate={navigate}/>;
      return <AppShell session={session} view={view} onNavigate={navigate}>{content()}</AppShell>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
  </script>
</body>
</html>
