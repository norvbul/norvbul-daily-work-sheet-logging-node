<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Work Sheet Logging</title>

  <!-- Required CDN libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root { color-scheme: light; }
    html, body, #root { min-height: 100%; }
    body { margin: 0; background: #f8fafc; color: #0f172a; }
    * { box-sizing: border-box; }
    .app-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .app-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .app-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .glass { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(14, 116, 144, .18); border-color: #0891b2; }
    .fade-in { animation: fadeIn .2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -500px 0; } 100% { background-position: 500px 0; } }
    .skeleton { background: linear-gradient(90deg,#e2e8f0 25%,#f8fafc 37%,#e2e8f0 63%); background-size: 1000px 100%; animation: shimmer 1.5s infinite linear; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState, useCallback, useRef } = React;
    const CLIENT_BUILD_VERSION = '2.0.0';
    const APP_VERSION = '2.0.0';

    /* =========================
     * SERVER COMMUNICATION
     * ========================= */

    async function callServer(functionName, ...args) {
      const response = await fetch('/api/rpc', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method: functionName, args })
      });
      let payload = null;
      try { payload = await response.json(); } catch { payload = null; }
      if (response.status === 401) {
        window.location.assign('/auth/login');
        throw new Error('Authentication required. Redirecting to sign in…');
      }
      if (!response.ok || !payload?.ok) {
        throw new Error(payload?.error?.message || `Server request failed (${response.status}).`);
      }
      return payload.data;
    }

    const notifyError = (error, title = 'Unable to complete action') => Swal.fire({
      icon: 'error',
      title,
      text: error?.message || String(error),
      confirmButtonText: 'OK'
    });

    const notifySuccess = (title, text = '') => Swal.fire({
      icon: 'success',
      title,
      text,
      timer: 1800,
      showConfirmButton: false
    });

    /* =========================
     * GENERAL UTILITIES
     * ========================= */

    function todayString() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function currentMonthString() {
      return todayString().slice(0, 7);
    }

    function num(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function pct(value) {
      return `${num(value).toFixed(1)}%`;
    }

    function minutesLabel(value) {
      const n = Math.round(num(value));
      if (n < 60) return `${n} min`;
      return `${Math.floor(n / 60)}h ${n % 60}m`;
    }

    function bool(value) {
      if (value === true) return true;
      return ['true', 'yes', '1', 'y', 'active'].includes(String(value || '').toLowerCase());
    }

    function statusClass(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('target met') || s === 'normal' || s === 'compliant' || s === 'closed' || s === 'reviewed') return 'bg-emerald-100 text-emerald-800 border-emerald-200';
      if (s.includes('watch') || s.includes('warning') || s === 'open') return 'bg-amber-100 text-amber-800 border-amber-200';
      if (s.includes('low')) return 'bg-orange-100 text-orange-800 border-orange-200';
      if (s.includes('critical')) return 'bg-red-100 text-red-800 border-red-200';
      return 'bg-slate-100 text-slate-700 border-slate-200';
    }

    function statusFromPercent(value, settings) {
      const p = num(value);
      const watch = num(settings.COMPLIANCE_WATCH_THRESHOLD, 75);
      const low = num(settings.COMPLIANCE_LOW_THRESHOLD, 50);
      if (p >= 100) return 'Target Met';
      if (p >= watch) return 'Watch';
      if (p >= low) return 'Low';
      return 'Critical';
    }

    function parseTime(value) {
      if (!value) return null;
      const m = String(value).match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      const h = Number(m[1]), min = Number(m[2]);
      if (h > 23 || min > 59) return null;
      return h * 60 + min;
    }

    function nextSequential(previous, base) {
      const day = Math.floor(previous / 1440);
      let candidate = day * 1440 + base;
      if (candidate >= previous) return candidate;
      const clock = previous % 1440;
      if (clock >= 18 * 60 && base <= 12 * 60) return (day + 1) * 1440 + base;
      return null;
    }

    function clientDurations(job) {
      const a = parseTime(job.AssignedTime);
      const oBase = parseTime(job.OnSiteTime);
      const cBase = parseTime(job.CompletedTime);
      if ([a, oBase, cBase].some(x => x === null)) return { eligible: false, valid: false };
      const o = nextSequential(a, oBase);
      if (o === null) return { eligible: true, valid: false };
      const c = nextSequential(o, cBase);
      if (c === null) return { eligible: true, valid: false };
      return { eligible: true, valid: true, a2o: o - a, o2c: c - o, a2c: c - a };
    }

    function downloadBlob(filename, content, type = 'text/csv;charset=utf-8;') {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportRowsToCsv(rows, filename) {
      if (!rows?.length) return Swal.fire({ icon: 'info', title: 'Nothing to export', text: 'There are no rows in the current result set.' });
      const ws = XLSX.utils.json_to_sheet(rows);
      const csv = XLSX.utils.sheet_to_csv(ws);
      downloadBlob(filename, csv);
    }

    function safeCell(value) {
      if (value === null || value === undefined) return '';
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      if (typeof value === 'object') return JSON.stringify(value);
      return String(value);
    }

    /* =========================
     * UI PRIMITIVES
     * ========================= */

    function Spinner({ size = 'md' }) {
      const cls = size === 'sm' ? 'h-4 w-4' : size === 'lg' ? 'h-10 w-10' : 'h-6 w-6';
      return <span className={`${cls} inline-block animate-spin rounded-full border-2 border-slate-300 border-t-cyan-700`}></span>;
    }

    function LoadingOverlay({ visible, text = 'Working…' }) {
      if (!visible) return null;
      return (
        <div className="fixed inset-0 z-[100] bg-slate-950/35 glass flex items-center justify-center px-4">
          <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 px-7 py-6 min-w-[260px] text-center">
            <Spinner size="lg" />
            <div className="mt-3 font-semibold text-slate-800">{text}</div>
            <div className="mt-1 text-xs text-slate-500">Please keep this window open.</div>
          </div>
        </div>
      );
    }

    function PageHeader({ title, subtitle, actions }) {
      return (
        <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
          <div>
            <h1 className="text-2xl md:text-3xl font-bold tracking-tight text-slate-900">{title}</h1>
            {subtitle && <p className="text-sm md:text-base text-slate-500 mt-1">{subtitle}</p>}
          </div>
          {actions && <div className="flex flex-wrap gap-2">{actions}</div>}
        </div>
      );
    }

    function Button({ children, onClick, type = 'button', variant = 'primary', disabled = false, icon, className = '' }) {
      const variants = {
        primary: 'bg-cyan-700 hover:bg-cyan-800 text-white border-cyan-700',
        secondary: 'bg-white hover:bg-slate-50 text-slate-700 border-slate-300',
        danger: 'bg-red-600 hover:bg-red-700 text-white border-red-600',
        ghost: 'bg-transparent hover:bg-slate-100 text-slate-700 border-transparent',
        dark: 'bg-slate-900 hover:bg-slate-800 text-white border-slate-900'
      };
      return (
        <button type={type} onClick={onClick} disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-xl border px-4 py-2.5 text-sm font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${className}`}>
          {icon && <i className={`fa-solid ${icon}`}></i>}
          {children}
        </button>
      );
    }

    function Badge({ children, status }) {
      return <span className={`inline-flex items-center rounded-full border px-2.5 py-1 text-xs font-semibold ${statusClass(status || children)}`}>{children}</span>;
    }

    function Card({ children, className = '' }) {
      return <div className={`bg-white rounded-2xl border border-slate-200 shadow-sm ${className}`}>{children}</div>;
    }

    function KpiCard({ label, value, hint, icon = 'fa-chart-line', tone = 'cyan' }) {
      const tones = {
        cyan: 'bg-cyan-50 text-cyan-700', emerald: 'bg-emerald-50 text-emerald-700', amber: 'bg-amber-50 text-amber-700',
        red: 'bg-red-50 text-red-700', violet: 'bg-violet-50 text-violet-700', slate: 'bg-slate-100 text-slate-700'
      };
      return (
        <Card className="p-5">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="text-xs uppercase tracking-wide font-bold text-slate-500">{label}</div>
              <div className="text-2xl md:text-3xl font-bold text-slate-900 mt-2">{value}</div>
              {hint && <div className="text-xs text-slate-500 mt-1">{hint}</div>}
            </div>
            <div className={`h-10 w-10 rounded-xl grid place-items-center ${tones[tone] || tones.cyan}`}><i className={`fa-solid ${icon}`}></i></div>
          </div>
        </Card>
      );
    }

    function Field({ label, required, children, help }) {
      return (
        <label className="block">
          <span className="text-sm font-semibold text-slate-700">{label}{required && <span className="text-red-500"> *</span>}</span>
          <div className="mt-1.5">{children}</div>
          {help && <span className="mt-1 block text-xs text-slate-500">{help}</span>}
        </label>
      );
    }

    const inputClass = 'w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 focus-ring';

    function Select({ value, onChange, children, disabled = false, className = '' }) {
      return <select value={value ?? ''} onChange={onChange} disabled={disabled} className={`${inputClass} ${className}`}>{children}</select>;
    }

    function MultiSelectDropdown({ value = '', options = [], onChange, placeholder = 'All parishes (no restriction)' }) {
      const [open, setOpen] = useState(false);
      const [query, setQuery] = useState('');
      const rootRef = useRef(null);

      const selected = useMemo(() => String(value || '')
        .split(',')
        .map(x => x.trim())
        .filter(Boolean), [value]);

      const selectedKeys = useMemo(() => new Set(selected.map(x => x.toLowerCase())), [selected.join('|')]);
      const normalizedOptions = useMemo(() => (options || []).map(o => typeof o === 'string' ? { value: o, label: o } : o), [options]);
      const filteredOptions = useMemo(() => {
        const q = query.trim().toLowerCase();
        return q ? normalizedOptions.filter(o => String(o.label || o.value).toLowerCase().includes(q)) : normalizedOptions;
      }, [normalizedOptions, query]);

      useEffect(() => {
        const closeOnOutsideClick = e => {
          if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('mousedown', closeOnOutsideClick);
        return () => document.removeEventListener('mousedown', closeOnOutsideClick);
      }, []);

      const emit = values => onChange?.(values.join(', '));
      const toggleOption = optionValue => {
        const key = String(optionValue).toLowerCase();
        const exists = selectedKeys.has(key);
        emit(exists ? selected.filter(x => x.toLowerCase() !== key) : [...selected, optionValue]);
      };
      const selectAll = () => emit(normalizedOptions.map(o => o.value));
      const clearAll = () => emit([]);
      const allSelected = normalizedOptions.length > 0 && normalizedOptions.every(o => selectedKeys.has(String(o.value).toLowerCase()));
      const summary = selected.length === 0
        ? placeholder
        : selected.length <= 2
          ? selected.join(', ')
          : `${selected.length} parishes selected`;

      return (
        <div ref={rootRef} className="relative">
          <button type="button" onClick={() => setOpen(v => !v)}
            className={`${inputClass} min-h-[42px] flex items-center justify-between gap-3 text-left`}>
            <span className={selected.length ? 'text-slate-900 truncate' : 'text-slate-500 truncate'}>{summary}</span>
            <span className="flex items-center gap-2 shrink-0">
              {selected.length > 0 && <span className="rounded-full bg-cyan-100 text-cyan-800 px-2 py-0.5 text-[11px] font-bold">{selected.length}</span>}
              <i className={`fa-solid fa-chevron-${open ? 'up' : 'down'} text-xs text-slate-400`}></i>
            </span>
          </button>

          {open && (
            <div className="mt-2 rounded-xl border border-slate-200 bg-white shadow-lg overflow-hidden">
              <div className="p-3 border-b border-slate-100">
                <div className="relative">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-400"></i>
                  <input className={`${inputClass} pl-9 py-2`} value={query} onChange={e => setQuery(e.target.value)} placeholder="Search parishes…" />
                </div>
                <div className="mt-2 flex items-center justify-between gap-2">
                  <button type="button" onClick={selectAll} disabled={allSelected}
                    className="text-xs font-semibold text-cyan-700 hover:text-cyan-900 disabled:text-slate-400 disabled:cursor-not-allowed">
                    <i className="fa-solid fa-check-double mr-1"></i>Select all
                  </button>
                  <button type="button" onClick={clearAll} disabled={!selected.length}
                    className="text-xs font-semibold text-slate-500 hover:text-slate-800 disabled:text-slate-300 disabled:cursor-not-allowed">
                    Clear selection
                  </button>
                </div>
              </div>

              <div className="max-h-56 overflow-y-auto app-scrollbar p-2">
                {!filteredOptions.length ? (
                  <div className="px-3 py-5 text-center text-xs text-slate-500">No matching parishes.</div>
                ) : filteredOptions.map(option => {
                  const checked = selectedKeys.has(String(option.value).toLowerCase());
                  return (
                    <label key={option.value} className="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-50 cursor-pointer select-none">
                      <input type="checkbox" checked={checked} onChange={() => toggleOption(option.value)}
                        className="h-4 w-4 rounded border-slate-300 text-cyan-700 focus:ring-cyan-600" />
                      <span className="text-sm text-slate-700 flex-1">{option.label}</span>
                      {checked && <i className="fa-solid fa-check text-xs text-cyan-700"></i>}
                    </label>
                  );
                })}
              </div>
            </div>
          )}

          {selected.length > 0 ? (
            <div className="mt-2 flex flex-wrap gap-1.5">
              {selected.map(parish => (
                <button key={parish} type="button" onClick={() => toggleOption(parish)}
                  className="inline-flex items-center gap-1.5 rounded-full border border-cyan-200 bg-cyan-50 px-2.5 py-1 text-[11px] font-semibold text-cyan-800 hover:bg-cyan-100"
                  title={`Remove ${parish}`}>
                  {parish}<i className="fa-solid fa-xmark"></i>
                </button>
              ))}
            </div>
          ) : (
            <div className="mt-1.5 text-xs text-slate-500">No selection means the user is authorized for all parishes.</div>
          )}
        </div>
      );
    }

    function EmptyState({ icon = 'fa-inbox', title = 'No data', text = 'There is nothing to display yet.' }) {
      return (
        <div className="py-12 text-center">
          <div className="h-12 w-12 rounded-2xl bg-slate-100 text-slate-500 grid place-items-center mx-auto"><i className={`fa-solid ${icon}`}></i></div>
          <div className="mt-3 font-semibold text-slate-800">{title}</div>
          <div className="mt-1 text-sm text-slate-500">{text}</div>
        </div>
      );
    }

    function DataTable({ rows, columns, pageSize = 20, renderCell, actions, rowKey = null }) {
      const [search, setSearch] = useState('');
      const [page, setPage] = useState(1);
      const cols = columns?.length ? columns : (rows?.[0] ? Object.keys(rows[0]) : []);
      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return rows || [];
        return (rows || []).filter(r => cols.some(c => safeCell(r[c]).toLowerCase().includes(q)));
      }, [rows, cols.join('|'), search]);
      const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
      useEffect(() => { if (page > pages) setPage(pages); }, [pages]);
      const current = filtered.slice((page - 1) * pageSize, page * pageSize);

      return (
        <div>
          <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
            <div className="relative sm:w-80">
              <i className="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-xs"></i>
              <input value={search} onChange={e => { setSearch(e.target.value); setPage(1); }} placeholder="Search results…"
                className={`${inputClass} pl-9`} />
            </div>
            <div className="text-xs text-slate-500">{filtered.length} row{filtered.length === 1 ? '' : 's'}</div>
          </div>
          {!current.length ? <EmptyState /> : (
            <div className="overflow-x-auto app-scrollbar">
              <table className="min-w-full text-sm">
                <thead className="bg-slate-50 border-b border-slate-200">
                  <tr>
                    {cols.map(c => <th key={c} className="px-4 py-3 text-left text-xs uppercase tracking-wide text-slate-500 font-bold whitespace-nowrap">{c.replace(/([a-z])([A-Z])/g, '$1 $2')}</th>)}
                    {actions && <th className="px-4 py-3 text-right text-xs uppercase tracking-wide text-slate-500 font-bold">Actions</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {current.map((row, idx) => (
                    <tr key={rowKey ? row[rowKey] : idx} className="hover:bg-slate-50/70">
                      {cols.map(c => (
                        <td key={c} className="px-4 py-3 align-top max-w-[320px]">
                          {renderCell ? renderCell(row, c) : <span className="break-words">{safeCell(row[c])}</span>}
                        </td>
                      ))}
                      {actions && <td className="px-4 py-3 text-right whitespace-nowrap">{actions(row)}</td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {filtered.length > pageSize && (
            <div className="p-4 border-t border-slate-200 flex items-center justify-between">
              <Button variant="secondary" disabled={page <= 1} onClick={() => setPage(p => p - 1)} icon="fa-chevron-left">Previous</Button>
              <span className="text-xs text-slate-500">Page {page} of {pages}</span>
              <Button variant="secondary" disabled={page >= pages} onClick={() => setPage(p => p + 1)} icon="fa-chevron-right">Next</Button>
            </div>
          )}
        </div>
      );
    }

    function Filters({ session, filters, setFilters, includeStatus = true }) {
      const crews = session.crews.filter(c => !filters.ContractorID || String(c.ContractorID) === String(filters.ContractorID));
      return (
        <Card className="p-4 mb-5">
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-7 gap-3">
            <Field label="Month">
              <input type="month" className={inputClass} value={filters.month || ''} onChange={e => setFilters({ ...filters, month: e.target.value, dateFrom: '', dateTo: '' })} />
            </Field>
            <Field label="Contractor">
              <Select value={filters.ContractorID || ''} disabled={session.user.Role === 'Contractor'} onChange={e => setFilters({ ...filters, ContractorID: e.target.value, CrewID: '' })}>
                <option value="">All contractors</option>
                {session.contractors.map(c => <option key={c.ContractorID} value={c.ContractorID}>{c.ContractorName}</option>)}
              </Select>
            </Field>
            <Field label="Crew">
              <Select value={filters.CrewID || ''} onChange={e => setFilters({ ...filters, CrewID: e.target.value })}>
                <option value="">All crews</option>
                {crews.map(c => <option key={c.CrewID} value={c.CrewID}>{c.CrewName}</option>)}
              </Select>
            </Field>
            <Field label="Parish">
              <Select value={filters.Parish || ''} onChange={e => setFilters({ ...filters, Parish: e.target.value })}>
                <option value="">All parishes</option>
                {session.parishes.map(p => <option key={p.ParishID} value={p.ParishName}>{p.ParishName}</option>)}
              </Select>
            </Field>
            <Field label="Work Type">
              <Select value={filters.WorkTypeID || ''} onChange={e => setFilters({ ...filters, WorkTypeID: e.target.value })}>
                <option value="">All work types</option>
                {session.workTypes.map(w => <option key={w.WorkTypeID} value={w.WorkTypeID}>{w.WorkTypeName}</option>)}
              </Select>
            </Field>
            <Field label="Shift">
              <Select value={filters.ShiftID || ''} onChange={e => setFilters({ ...filters, ShiftID: e.target.value })}>
                <option value="">All shifts</option>
                {session.shifts.map(s => <option key={s.ShiftID} value={s.ShiftID}>{s.ShiftName}</option>)}
              </Select>
            </Field>
            {includeStatus && <Field label="Status">
              <Select value={filters.Status || ''} onChange={e => setFilters({ ...filters, Status: e.target.value })}>
                <option value="">All statuses</option>
                <option>Target Met</option><option>Watch</option><option>Low</option><option>Critical</option>
              </Select>
            </Field>}
          </div>
          <div className="mt-3 flex justify-end">
            <button className="text-xs font-semibold text-slate-500 hover:text-cyan-700" onClick={() => setFilters({ month: currentMonthString(), ContractorID: session.user.Role === 'Contractor' ? session.user.ContractorID : '' })}>
              <i className="fa-solid fa-rotate-left mr-1"></i> Reset filters
            </button>
          </div>
        </Card>
      );
    }

    /* =========================
     * LANDING / LAYOUT
     * ========================= */

    function Landing({ session, onNavigate }) {
      const s = session.settings;

    /* =========================
     * WORKSHEET FORM
     * ========================= */

    const emptyJob = () => ({ JobID:'', CustomerName:'', CustomerAddress:'', ProblemReported:'', AssignedTime:'', OnSiteTime:'', CompletedTime:'', ActionTaken:'', MaterialUsed:'', VoltageFound:'', VoltageLeft:'', Remarks:'' });

    function WorksheetForm({ session, editWorksheetId, onEditConsumed, onSaved }) {
      const defaultContractor = session.user.Role === 'Contractor' ? session.user.ContractorID : '';
      const [form, setForm] = useState({ WorksheetID:'', ContractorID:defaultContractor, WorkTypeID:'', DateWorked:todayString(), Parish:'', Location:'', CrewID:'', TeamMembers:'', ShiftID:'', jobs:Array.from({length:num(session.settings.MIN_JOBS_PER_SHIFT,6)}, emptyJob) });
      const [busy, setBusy] = useState(false);
      const [loadingEdit, setLoadingEdit] = useState(false);

      const availableCrews = useMemo(() => session.crews.filter(c => !form.ContractorID || String(c.ContractorID) === String(form.ContractorID)), [session.crews, form.ContractorID]);
      const requiredJobs = num(session.settings.MIN_JOBS_PER_SHIFT, 6);
      const requiredFields = String(session.settings.REQUIRED_JOB_FIELDS || 'JobID,ProblemReported,AssignedTime,OnSiteTime,CompletedTime,ActionTaken,Remarks').split(',').map(s=>s.trim()).filter(Boolean);
      const minGap = num(session.settings.MIN_TIME_GAP_MINUTES, 15);

      useEffect(() => {
        if (!editWorksheetId) return;
        (async () => {
          setLoadingEdit(true);
          try {
            const data = await callServer('getWorksheet', editWorksheetId);
            const w = data.worksheet;
            setForm({
              WorksheetID:w.WorksheetID, ContractorID:w.ContractorID, WorkTypeID:w.WorkTypeID, DateWorked:w.DateWorked, Parish:w.Parish,
              Location:w.Location || '', CrewID:w.CrewID, TeamMembers:w.TeamMembers || '', ShiftID:w.ShiftID,
              jobs:data.jobs.map(j => ({...emptyJob(), ...j}))
            });
          } catch (e) { notifyError(e, 'Worksheet could not be opened'); }
          finally { setLoadingEdit(false); onEditConsumed?.(); }
        })();
      }, [editWorksheetId]);

      const live = useMemo(() => {
        const active = form.jobs.filter(j => Object.values(j).some(v => String(v || '').trim() !== ''));
        const completed = active.filter(j => j.JobID && j.CompletedTime).length;
        let missing = 0, timingEligible = 0, timingValid = 0, timingIssues = 0, slaIssues = 0;
        const a2os = [], a2cs = [];
        active.forEach(j => {
          if (requiredFields.some(f => !String(j[f] || '').trim())) missing++;
          const d = clientDurations(j);
          if (d.eligible) {
            timingEligible++;
            const close = d.valid && (d.a2o < minGap || d.o2c < minGap);
            if (d.valid && !close) timingValid++; else timingIssues++;
            if (d.valid) {
              a2os.push(d.a2o); a2cs.push(d.a2c);
              if (d.a2o > num(session.settings.ASSIGN_TO_ONSITE_WARNING_MIN,60) || d.o2c > num(session.settings.ONSITE_TO_COMPLETE_WARNING_MIN,180) || d.a2c > num(session.settings.ASSIGN_TO_COMPLETE_WARNING_MIN,240)) slaIssues++;
            }
          }
        });
        const production = requiredJobs ? (completed / requiredJobs) * 100 : 0;
        return {
          active: active.length, completed, balance: completed-requiredJobs, production,
          status: statusFromPercent(production, session.settings), missing,
          timingCompliance: timingEligible ? timingValid/timingEligible*100 : 0,
          timingIssues, slaIssues,
          avgA2O: a2os.length ? a2os.reduce((a,b)=>a+b,0)/a2os.length : 0,
          avgA2C: a2cs.length ? a2cs.reduce((a,b)=>a+b,0)/a2cs.length : 0
        };
      }, [form.jobs, requiredJobs, requiredFields.join('|'), minGap, JSON.stringify(session.settings)]);

      const updateHeader = (field, value) => {
        setForm(prev => {
          const next = { ...prev, [field]: value };
          if (field === 'ContractorID') { next.CrewID=''; next.TeamMembers=''; }
          if (field === 'CrewID') {
            const crew = session.crews.find(c => String(c.CrewID) === String(value));
            const members = session.crewMembers.filter(m => String(m.CrewID) === String(value)).map(m => m.EmployeeName).filter(Boolean);
            if (crew?.Parish) next.Parish = crew.Parish;
            next.TeamMembers = members.join(', ');
          }
          return next;
        });
      };

      const updateJob = (index, field, value) => setForm(prev => ({...prev, jobs: prev.jobs.map((j,i)=>i===index?{...j,[field]:value}:j)}));
      const addJob = () => setForm(prev => ({...prev, jobs:[...prev.jobs, emptyJob()]}));
      const removeJob = index => setForm(prev => ({...prev, jobs:prev.jobs.filter((_,i)=>i!==index)}));
      const duplicateJob = index => setForm(prev => ({...prev, jobs:[...prev.jobs.slice(0,index+1), {...prev.jobs[index], JobRecordID:'', JobID:''}, ...prev.jobs.slice(index+1)]}));

      const resetForm = () => setForm({ WorksheetID:'', ContractorID:defaultContractor, WorkTypeID:'', DateWorked:todayString(), Parish:'', Location:'', CrewID:'', TeamMembers:'', ShiftID:'', jobs:Array.from({length:requiredJobs}, emptyJob) });

      const submit = async e => {
        e.preventDefault();
        const requiredHeader = [['ContractorID','Contractor'],['WorkTypeID','Work Type'],['DateWorked','Date Worked'],['Parish','Parish'],['CrewID','Crew'],['ShiftID','Shift']];

    const BULK_TEMPLATE_PASSWORD = 'QwikLock69';
    const BULK_TEMPLATE_NAME = 'Daily Work Sheet Logging Bulk Import Template';
    const BULK_TEMPLATE_VERSION = '1.1';
    const BULK_TEMPLATE_MAX_ROWS = 5000;

    function legacyExcelPasswordHash(password) {
      let hash = 0;
      for (let i = password.length - 1; i >= 0; i--) {
        const carry = (hash >> 14) & 0x01;
        hash = ((hash << 1) & 0x7fff) | carry;
        hash ^= password.charCodeAt(i);
      }
      const carry = (hash >> 14) & 0x01;
      hash = ((hash << 1) & 0x7fff) | carry;
      hash ^= password.length;
      hash ^= 0xCE4B;
      return hash.toString(16).toUpperCase().padStart(4, '0');
    }

    async function addWorkbookStructureProtection(buffer, password) {
      if (!window.JSZip) throw new Error('Workbook protection library is unavailable. Refresh the page and try again.');
      const zip = await JSZip.loadAsync(buffer);
      const workbookXmlFile = zip.file('xl/workbook.xml');
      if (!workbookXmlFile) throw new Error('The generated workbook structure could not be protected.');
      let xml = await workbookXmlFile.async('string');
      xml = xml.replace(/<workbookProtection\b[^>]*\/>/g, '');
      const protection = `<workbookProtection workbookPassword="${legacyExcelPasswordHash(password)}" lockStructure="1"/>`;
      if (/<bookViews\b/.test(xml)) xml = xml.replace(/<bookViews\b/, protection + '<bookViews');
      else if (/<sheets\b/.test(xml)) xml = xml.replace(/<sheets\b/, protection + '<sheets');
      else xml = xml.replace('</workbook>', protection + '</workbook>');
      zip.file('xl/workbook.xml', xml);
      return zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
    }

    const BULK_TEMPLATE_FALLBACK_INSTRUCTIONS = [
      ['DAILY JOB COMPLETION BULK IMPORT TEMPLATE'],
      ['Use the DataEntry sheet only. One row represents one completed/attempted job. Repeat the worksheet-level fields for each job belonging to the same contractor, date, crew and shift.'],
