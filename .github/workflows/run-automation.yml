name: Run Daily Work Sheet Automation

on:
  workflow_dispatch: # Allows you to manually trigger this from your phone

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: gives the runner permission to commit files

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Automation Script
        run: node your-automation-script.js # Change this to your script's filename

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated update to work sheet"
          git push
